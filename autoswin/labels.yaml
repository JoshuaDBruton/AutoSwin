# --- VinDr Descriptive Labels (28 classes) ---
VINDR_DESC:
  - "A chest X-ray showing an enlarged aorta, indicating aortic enlargement."
  - "A chest X-ray with evidence of lung collapse or incomplete expansion, known as atelectasis."
  - "A chest X-ray displaying abnormal calcium deposits in the chest, indicating calcification."
  - "A chest X-ray showing an enlarged heart, a condition called cardiomegaly."
  - "A chest X-ray revealing a broken clavicle bone, indicating a clavicle fracture."
  - "A chest X-ray with areas of increased lung density, suggesting lung consolidation."
  - "A chest X-ray showing fluid accumulation in the lungs, consistent with pulmonary edema."
  - "A chest X-ray with signs of overinflated lungs and reduced lung markings, characteristic of emphysema."
  - "A chest X-ray showing an enlarged pulmonary artery, indicating pulmonary artery enlargement."
  - "A chest X-ray with diffuse interstitial markings, consistent with interstitial lung disease (ILD)."
  - "A chest X-ray displaying patchy or diffuse opacities in the lungs, suggesting infiltration."
  - "A chest X-ray with abnormal opaque areas in the lung fields, indicating lung opacity."
  - "A chest X-ray showing a hollow, air-filled space within the lung, known as a lung cavity."
  - "A chest X-ray revealing a round, thin-walled air-filled space in the lung, indicating a lung cyst."
  - "A chest X-ray with displacement of the mediastinum to one side, indicating mediastinal shift."
  - "A chest X-ray showing a distinct round nodule or mass in the lung."
  - "A chest X-ray with fluid accumulation in the pleural space, consistent with pleural effusion."
  - "A chest X-ray showing thickened pleural lining, indicating pleural thickening."
  - "A chest X-ray revealing air in the pleural space, causing lung collapse, known as pneumothorax."
  - "A chest X-ray with reticular or honeycomb patterns in the lungs, consistent with pulmonary fibrosis."
  - "A chest X-ray showing a break or crack in one of the ribs, indicating a rib fracture."
  - "A chest X-ray displaying an abnormal lesion in the chest that does not fit other categories."
  - "A chest X-ray with signs of chronic obstructive pulmonary disease, such as hyperinflated lungs and flattened diaphragm."
  - "A chest X-ray showing a suspicious mass or tumor in the lung."
  - "A chest X-ray with localized or diffuse lung opacities, consistent with pneumonia."
  - "A chest X-ray showing features suggestive of pulmonary tuberculosis, such as upper lobe opacities or cavitation."
  - "A chest X-ray with abnormalities indicating other diseases not specified in the main categories."
  - "A normal chest X-ray with no abnormal findings."

