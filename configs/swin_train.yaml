# Full BiomedCLIP + Swin + QFormer + PTuning on VinDr
# Usage: python run_fold.py --fold_number 0 --config configs/swin_train_config.yaml

PROJECT_NAME: "competition"
GROUP_NAME: "swin-qf-pt-vindr"

# Architecture
FOUNDATION_MODEL: "biomedclip"  # or "medclip"
SWIN_HEAD: True
USE_QFORMER: True
USE_PTUNING: True
USE_DECODER: False
USE_MULTILABEL: True
USE_ORDINAL_CLASS: False

# Data
LABELS_KEY: "lab"
LABEL_SET: "VINDR_BASIC"
IMAGE_SIZE: 896
# Paths relative to BIOMED_DATA_DIR (or absolute)
DATA_PATH: "vindr_{image_size}_lanczos_paperGlobal.h5"
TEST_DATA_PATH: "vindr_{image_size}_lanczos_paperGlobal.h5"
SPLIT_FILE: "vindr_stratified_split.json"
SWIN_PRETRAINED_PATH: null  # set to path if you have a pretrained swin checkpoint

# Training
BATCH_SIZE: 1
LEARNING_RATE: 5e-5
EPOCHS: 150
FOUNDATION_MODEL_FROZEN_EPOCHS: 251
SWIN_FROZEN_EPOCHS: 0
LEARNING_RATE_DECAY_STEP_SIZE: 25
LEARNING_RATE_DECAY_GAMMA: 0.5

# Other
OVERSAMPLE: False
USE_AUTOCAST: False
ALIGNMENT_LOSS_WEIGHT: 0
FIDELITY_WEIGHT: -1
CHECKPOINT_SAVE_DIR: "swin-{suffix}-{fold_number}"
